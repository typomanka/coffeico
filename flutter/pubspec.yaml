name: coffeico_plus
description: Maintained fork of Coffeico by typomanka, providing Flutter icons for coffee brewing methods, equipment, beans, bags, and cupping.
version: 1.0.1
homepage: https://github.com/antonkarliner/coffeico
repository: https://github.com/antonkarliner/coffeico
issue_tracker: https://github.com/antonkarliner/coffeico/issues

topics:
  - coffee
  - flutter
  - icon-font
  - icons

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.10.9
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Coffeico
      fonts:
        - asset: fonts/Coffeico.ttf
